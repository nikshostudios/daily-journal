<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f0eb;
      --surface: #ffffff;
      --surface2: #f9f6f2;
      --border: #e8e2db;
      --text: #2c2c2c;
      --text-muted: #888;
      --text-faint: #bbb;
      --accent: #2c2c2c;
      --accent-text: #f5f0eb;
      --header-bg: #2c2c2c;
      --header-text: #f5f0eb;
      --danger: #c0392b;
      --danger-border: #f5c6c2;
      --month-bg: #f0ebe4;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    [data-theme="dark"] {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface2: #2a2a2a;
      --border: #333;
      --text: #e8e2db;
      --text-muted: #888;
      --text-faint: #555;
      --accent: #e8e2db;
      --accent-text: #1a1a1a;
      --header-bg: #111;
      --header-text: #e8e2db;
      --danger: #e05c4b;
      --danger-border: #5a2a24;
      --month-bg: #1f1f1f;
      --shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ── Auth Screen ── */
    #authScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .auth-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: normal;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .auth-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .auth-field {
      margin-bottom: 14px;
    }

    .auth-field label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .auth-field input {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .auth-field input:focus { border-color: var(--text-muted); }

    .auth-error {
      font-size: 0.82rem;
      color: var(--danger);
      margin-bottom: 14px;
      min-height: 18px;
    }

    .auth-btn {
      width: 100%;
      padding: 11px;
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
      margin-bottom: 10px;
    }
    .auth-btn:hover { opacity: 0.8; }
    .auth-btn-primary { background: var(--accent); color: var(--accent-text); }
    .auth-btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

    .auth-toggle {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .auth-toggle span {
      color: var(--text);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ── App ── */
    #app { display: none; }

    /* ── Header ── */
    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 { font-size: 1.4rem; font-weight: normal; letter-spacing: 1px; }

    .header-right { display: flex; align-items: center; gap: 14px; }

    .header-user {
      font-size: 0.78rem;
      opacity: 0.5;
      font-family: monospace;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dark-toggle {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--header-text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-family: 'Georgia', serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .dark-toggle:hover { background: rgba(255,255,255,0.1); opacity: 1; }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--header-text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.1); opacity: 1; }

    /* ── Mode tabs ── */
    .mode-tabs {
      display: flex;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 20px;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text); opacity: 1; }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

    /* ── Container ── */
    .container { max-width: 820px; margin: 0 auto; padding: 36px 20px; }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    /* ── Write section ── */
    .write-section {
      background: var(--surface);
      border-radius: 6px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 36px;
      border: 1px solid var(--border);
    }

    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .write-section textarea {
      width: 100%;
      min-height: 180px;
      border: none;
      resize: vertical;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      line-height: 1.85;
      color: var(--text);
      outline: none;
      background: transparent;
    }
    .write-section textarea::placeholder { color: var(--text-faint); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    .write-actions { display: flex; justify-content: flex-end; gap: 10px; }

    /* ── Buttons ── */
    button { cursor: pointer; border: none; border-radius: 4px; font-family: 'Georgia', serif; transition: opacity 0.15s; }
    button:hover { opacity: 0.75; }

    .btn-primary { background: var(--accent); color: var(--accent-text); font-size: 0.9rem; padding: 9px 22px; }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 0.9rem; padding: 9px 18px; }
    .btn-sm { font-size: 0.78rem; padding: 4px 12px; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger-border); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

    /* ── Search / toolbar ── */
    .entries-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .entries-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .search-bar {
      flex: 1;
      max-width: 280px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .search-bar:focus { border-color: var(--text-muted); }
    .search-bar::placeholder { color: var(--text-faint); }

    /* ── Month groups ── */
    .month-group { margin-bottom: 36px; }

    .month-heading {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      padding: 8px 14px;
      background: var(--month-bg);
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .month-heading .month-count { font-size: 0.7rem; color: var(--text-faint); }

    /* ── Entry cards (always visible, stacked) ── */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 22px 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .entry-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .entry-day {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .entry-card-actions { display: flex; gap: 8px; }

    .entry-full-text {
      font-size: 0.97rem;
      line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
    }

    .entry-edit-area {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
      resize: vertical;
      font-family: 'Georgia', serif;
      font-size: 0.97rem;
      line-height: 1.85;
      color: var(--text);
      background: var(--surface2);
      outline: none;
    }

    .entry-edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

    /* ── Empty / loading ── */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-faint);
      font-size: 0.95rem;
    }

    /* ════════════════════════════════
       TASKS PANEL
    ════════════════════════════════ */
    .task-input-row { display: flex; gap: 10px; margin-bottom: 28px; }

    .task-input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .task-input:focus { border-color: var(--text-muted); }
    .task-input::placeholder { color: var(--text-faint); }

    .task-sections { display: flex; flex-direction: column; gap: 28px; }

    .task-section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .task-list { display: flex; flex-direction: column; gap: 6px; }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .task-item.done { opacity: 0.5; }
    .task-item.done .task-text { text-decoration: line-through; }

    .task-checkbox {
      width: 17px; height: 17px;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: background 0.15s, border-color 0.15s;
      padding: 0;
    }
    .task-checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .task-checkbox.checked::after { content: '✓'; color: var(--accent-text); font-size: 11px; line-height: 1; }

    .task-text { flex: 1; font-size: 0.95rem; color: var(--text); font-family: 'Georgia', serif; }

    .task-date { font-size: 0.72rem; color: var(--text-faint); font-family: monospace; white-space: nowrap; }

    .task-delete {
      background: transparent; border: none; color: var(--text-faint);
      font-size: 1rem; padding: 0 4px; cursor: pointer; line-height: 1; transition: color 0.15s;
    }
    .task-delete:hover { color: var(--danger); opacity: 1; }

    .tasks-empty { text-align: center; padding: 30px; color: var(--text-faint); font-size: 0.9rem; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--accent); color: var(--accent-text);
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 0.84rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s;
      pointer-events: none;
      font-family: 'Georgia', serif;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<!-- ══════════════════════════════════
     AUTH SCREEN
══════════════════════════════════ -->
<div id="authScreen">
  <div class="auth-box">
    <h2 class="auth-title">My Journal</h2>
    <p class="auth-subtitle" id="authSubtitle">Sign in to continue</p>

    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" onkeydown="if(event.key==='Enter')handleAuth()">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleAuth()">
    </div>

    <div class="auth-error" id="authError"></div>

    <button class="auth-btn auth-btn-primary" id="authMainBtn" onclick="handleAuth()">Sign In</button>
    <div class="auth-toggle" id="authToggleText">
      No account? <span onclick="toggleAuthMode()">Create one</span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     APP
══════════════════════════════════ -->
<div id="app">

  <header>
    <h1>My Journal</h1>
    <div class="header-right">
      <span class="header-user" id="headerUser"></span>
      <button class="dark-toggle" onclick="toggleDark()">
        <span id="darkIcon">☾</span>
        <span id="darkLabel">Dark</span>
      </button>
      <button class="logout-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div class="mode-tabs">
    <button class="tab-btn active" id="tab-journal" onclick="switchMode('journal')">Journal</button>
    <button class="tab-btn" id="tab-tasks" onclick="switchMode('tasks')">Tasks</button>
  </div>

  <!-- JOURNAL PANEL -->
  <div class="mode-panel active" id="panel-journal">
    <div class="container">

      <div class="write-section">
        <div class="section-label">New Entry — <span id="todayLabel"></span></div>
        <textarea id="entryText" placeholder="What's on your mind today?"></textarea>
        <hr class="divider">
        <div class="write-actions">
          <button class="btn-secondary" onclick="clearEditor()">Clear</button>
          <button class="btn-primary" onclick="saveEntry()">Save Entry</button>
        </div>
      </div>

      <div class="entries-toolbar">
        <span class="entries-title">Entries</span>
        <input type="text" class="search-bar" id="searchBar" placeholder="Search by date or keyword…" oninput="renderEntries()">
      </div>

      <div id="entryList"></div>
    </div>
  </div>

  <!-- TASKS PANEL -->
  <div class="mode-panel" id="panel-tasks">
    <div class="container">
      <div class="task-input-row">
        <input type="text" class="task-input" id="taskInput" placeholder="Add a task…" onkeydown="if(event.key==='Enter') addTask()">
        <button class="btn-primary" onclick="addTask()">Add</button>
      </div>
      <div class="task-sections">
        <div>
          <div class="task-section-label">To Do</div>
          <div class="task-list" id="tasksTodo"></div>
        </div>
        <div>
          <div class="task-section-label">Completed</div>
          <div class="task-list" id="tasksDone"></div>
        </div>
      </div>
    </div>
  </div>

</div><!-- #app -->

<div class="toast" id="toast"></div>

<script>
  /* ─────────────────────────────────────
     SUPABASE
  ───────────────────────────────────── */
  const { createClient } = supabase;
  const sb = createClient(
    'https://culjoqqsvrbhcsiixrtw.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1bGpvcXFzdnJiaGNzaWl4cnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NzgzNjksImV4cCI6MjA5MDI1NDM2OX0.4_6KqoB4j0236NraGj2j_YA1x1qKOm7VY3tV469r7tU'
  );

  /* ─────────────────────────────────────
     UTILS
  ───────────────────────────────────── */
  const THEME_KEY = 'journal_theme';
  let isSignUp = false;

  function todayStr() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function entryDayLabel(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    return `${d} ${months[m-1]} ${y}`;
  }

  function monthLabel(dateStr) {
    const [y, m] = dateStr.split('-').map(Number);
    const months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    return `${months[m-1]} ${y}`;
  }

  function monthKey(dateStr) { return dateStr.slice(0, 7); }

  /* ─────────────────────────────────────
     THEME
  ───────────────────────────────────── */
  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('darkIcon').textContent  = dark ? '☀' : '☾';
    document.getElementById('darkLabel').textContent = dark ? 'Light' : 'Dark';
    localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
  }

  function toggleDark() {
    applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
  }

  /* ─────────────────────────────────────
     AUTH
  ───────────────────────────────────── */
  function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('authSubtitle').textContent   = isSignUp ? 'Create your account' : 'Sign in to continue';
    document.getElementById('authMainBtn').textContent    = isSignUp ? 'Create Account' : 'Sign In';
    document.getElementById('authToggleText').innerHTML   = isSignUp
      ? 'Already have an account? <span onclick="toggleAuthMode()">Sign in</span>'
      : 'No account? <span onclick="toggleAuthMode()">Create one</span>';
    document.getElementById('authError').textContent = '';
  }

  async function handleAuth() {
    const email    = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errorEl  = document.getElementById('authError');
    errorEl.textContent = '';

    if (!email || !password) { errorEl.textContent = 'Please enter your email and password.'; return; }

    if (isSignUp) {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) { errorEl.textContent = error.message; return; }
      showToast('Account created! Signing you in…');
      // Auto sign in after sign up
      const { error: signInError } = await sb.auth.signInWithPassword({ email, password });
      if (signInError) { errorEl.textContent = signInError.message; return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { errorEl.textContent = error.message; return; }
    }
  }

  async function signOut() {
    await sb.auth.signOut();
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
  }

  // Listen for auth state changes
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('headerUser').textContent = session.user.email;
      await bootApp();
    } else {
      document.getElementById('app').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
    }
  });

  /* ─────────────────────────────────────
     MODE TABS
  ───────────────────────────────────── */
  function switchMode(mode) {
    ['journal','tasks'].forEach(m => {
      document.getElementById(`tab-${m}`).classList.toggle('active', m === mode);
      document.getElementById(`panel-${m}`).classList.toggle('active', m === mode);
    });
  }

  /* ─────────────────────────────────────
     JOURNAL — DB
  ───────────────────────────────────── */
  async function fetchEntries() {
    const { data, error } = await sb
      .from('journal_entries')
      .select('*')
      .order('date', { ascending: false }); // newest first
    if (error) { console.error(error); return []; }
    return data;
  }

  async function saveEntry() {
    const text = document.getElementById('entryText').value.trim();
    if (!text) { showToast('Write something first.'); return; }

    const date = todayStr();
    const { data: existing } = await sb
      .from('journal_entries').select('id').eq('date', date).maybeSingle();

    let savedId;
    if (existing) {
      const { error } = await sb.from('journal_entries')
        .update({ text, updated_at: new Date().toISOString() }).eq('date', date);
      if (error) { showToast('Error saving.'); console.error(error); return; }
      savedId = existing.id;
      showToast("Today's entry updated.");
    } else {
      savedId = Date.now();
      const { error } = await sb.from('journal_entries')
        .insert({ id: savedId, date, text });
      if (error) { showToast('Error saving.'); console.error(error); return; }
      showToast('Entry saved.');
    }

    document.getElementById('entryText').value = '';
    await renderEntries();

    const savedCard = document.querySelector(`.entry-card[data-id="${savedId}"]`);
    if (savedCard) savedCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    const { error } = await sb.from('journal_entries').delete().eq('id', id);
    if (error) { showToast('Error deleting.'); return; }
    await renderEntries();
    showToast('Entry deleted.');
  }

  function startEdit(id) {
    const card      = document.querySelector(`.entry-card[data-id="${id}"]`);
    const textEl    = card.querySelector('.entry-full-text');
    const actionsEl = card.querySelector('.entry-card-actions');

    const ta = document.createElement('textarea');
    ta.className = 'entry-edit-area';
    ta.value = textEl.textContent;
    textEl.replaceWith(ta);
    ta.focus();

    actionsEl.innerHTML = `
      <button class="btn-secondary btn-sm" onclick="renderEntries()">Cancel</button>
      <button class="btn-primary btn-sm" onclick="commitEdit(${id})">Save</button>
    `;
  }

  async function commitEdit(id) {
    const ta = document.querySelector(`.entry-card[data-id="${id}"] .entry-edit-area`);
    const newText = ta.value.trim();
    if (!newText) { showToast('Entry cannot be empty.'); return; }

    const { error } = await sb.from('journal_entries')
      .update({ text: newText, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) { showToast('Error saving.'); return; }
    await renderEntries();
    showToast('Entry updated.');
  }

  async function renderEntries(preloaded) {
    const list  = document.getElementById('entryList');
    const query = document.getElementById('searchBar').value.toLowerCase().trim();

    list.innerHTML = '<div class="empty-state">Loading…</div>';
    let entries = preloaded || await fetchEntries();

    // Search: match text content OR date string (e.g. "28 march", "march 2026", "2026-03-28")
    if (query) {
      entries = entries.filter(e =>
        e.text.toLowerCase().includes(query) ||
        entryDayLabel(e.date).toLowerCase().includes(query) ||
        monthLabel(e.date).toLowerCase().includes(query) ||
        e.date.includes(query)
      );
    }

    if (entries.length === 0) {
      list.innerHTML = `<div class="empty-state">${query ? 'No entries found for "' + escapeHtml(query) + '".' : 'No entries yet. Start writing above.'}</div>`;
      return;
    }

    // Group by month (entries already sorted newest-first from DB)
    const groups = {}, groupOrder = [];
    entries.forEach(e => {
      const mk = monthKey(e.date);
      if (!groups[mk]) { groups[mk] = []; groupOrder.push(mk); }
      groups[mk].push(e);
    });

    list.innerHTML = groupOrder.map(mk => {
      const monthEntries = groups[mk];
      const label = monthLabel(monthEntries[0].date);

      const cards = monthEntries.map(e => `
        <div class="entry-card" data-id="${e.id}">
          <div class="entry-card-header">
            <span class="entry-day">${entryDayLabel(e.date)}</span>
            <div class="entry-card-actions">
              <button class="btn-ghost btn-sm" onclick="startEdit(${e.id})">Edit</button>
              <button class="btn-danger btn-sm" onclick="deleteEntry(${e.id})">Delete</button>
            </div>
          </div>
          <div class="entry-full-text">${escapeHtml(e.text)}</div>
        </div>
      `).join('');

      return `
        <div class="month-group">
          <div class="month-heading">
            <span>${label}</span>
            <span class="month-count">${monthEntries.length} ${monthEntries.length === 1 ? 'entry' : 'entries'}</span>
          </div>
          ${cards}
        </div>`;
    }).join('');
  }

  function clearEditor() { document.getElementById('entryText').value = ''; }

  /* ─────────────────────────────────────
     TASKS — DB
  ───────────────────────────────────── */
  async function fetchTasks() {
    const { data, error } = await sb.from('tasks').select('*').order('created_at', { ascending: true });
    if (error) { console.error(error); return []; }
    return data;
  }

  async function addTask() {
    const input = document.getElementById('taskInput');
    const text  = input.value.trim();
    if (!text) return;

    const { error } = await sb.from('tasks').insert({ id: Date.now(), text, done: false, date: todayStr() });
    if (error) { showToast('Error adding task.'); return; }
    input.value = '';
    await renderTasks();
    showToast('Task added.');
  }

  async function toggleTask(id) {
    const { data } = await sb.from('tasks').select('done').eq('id', id).single();
    await sb.from('tasks').update({ done: !data.done }).eq('id', id);
    await renderTasks();
  }

  async function deleteTask(id) {
    await sb.from('tasks').delete().eq('id', id);
    await renderTasks();
  }

  function taskItemHtml(t) {
    return `
      <div class="task-item${t.done ? ' done' : ''}">
        <button class="task-checkbox${t.done ? ' checked' : ''}" onclick="toggleTask(${t.id})"></button>
        <span class="task-text">${escapeHtml(t.text)}</span>
        <span class="task-date">${t.date}</span>
        <button class="task-delete" onclick="deleteTask(${t.id})" title="Delete">✕</button>
      </div>`;
  }

  async function renderTasks() {
    const todoEl = document.getElementById('tasksTodo');
    const doneEl = document.getElementById('tasksDone');
    todoEl.innerHTML = doneEl.innerHTML = '<div class="tasks-empty">Loading…</div>';
    const tasks = await fetchTasks();
    const todo  = tasks.filter(t => !t.done);
    const done  = tasks.filter(t =>  t.done);
    todoEl.innerHTML = todo.length ? todo.map(taskItemHtml).join('') : '<div class="tasks-empty">No pending tasks.</div>';
    doneEl.innerHTML = done.length ? done.map(taskItemHtml).join('') : '<div class="tasks-empty">Nothing completed yet.</div>';
  }

  /* ─────────────────────────────────────
     BOOT (after login)
  ───────────────────────────────────── */
  async function bootApp() {
    applyTheme(localStorage.getItem(THEME_KEY) === 'dark');

    const today = todayStr();
    document.getElementById('todayLabel').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    const entries = await fetchEntries();
    const todayEntry = entries.find(e => e.date === today);
    if (todayEntry) document.getElementById('entryText').value = todayEntry.text;

    await Promise.all([renderEntries(entries), renderTasks()]);
  }

  /* ─────────────────────────────────────
     INIT
  ───────────────────────────────────── */
  applyTheme(localStorage.getItem(THEME_KEY) === 'dark');
</script>
</body>
</html>
